<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script>
        async function logout() {
            const response = await fetch(`api/login.php`, {
                method: 'DELETE'
            });
            const data = await response.json();
            console.log(data);
        }
        logout();
    </script>
</head>

<body>
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
        <form id="formLogin" class="bg-white p-8 rounded-xl shadow-lg w-96">
            <h2 class="text-2xl font-bold text-center">
                Iniciar sesión
            </h2>
            <input id="correo" type="email" placeholder="Correo" class="w-full border p-3 rounded mt-4">

            <input id="password" type="password" placeholder="Contraseña" class="w-full border p-3 rounded mt-4">

            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded mt-4">
                Ingresar
            </button>
        </form>
    </div>
</body>

<script src="js/login.js"></script>

</html>
