<h1>VISTA DE PRODUCTOS</h1>

<div class="my-4 border-t border-slate-600"></div>

<div class="my-4">
    <form id="formFiltro" class="flex gap-4 items-end">
        <div class="flex-1">
            <label>Producto</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre del producto..."
                class="border w-full rounded px-3 py-2">
        </div>

        <button type="submit" class="bg-blue-500 text-while px-5 py-2 rounded">
            Filtrar
        </button>

        <!--Agregar precio_min, precio_max y usar tailwind para cambiar el buscador al lado izquierdo-->
    </form>
</div>

<div id="div_filtros" class="flex flex-wrap gap-2 my-4"></div>

<table class="min-w-full border-y border-collapse">
    <thead class="bg-gray-100">
        <tr>
            <th class="px-4 py-2">Id</th>
            <th class="px-4 py-2">Nombre</th>
            <th class="px-4 py-2">Categoría</th>
            <th class="px-4 py-2">Precio</th>
            <th class="w-48 px-4 py-2"> - </th>
        </tr>
    </thead>
    <tbody id="table-products">
        <!-- Aquí se llenarán los datos de los productos -->
    </tbody>
</table>

<div class="flex justify-between items-center gap-4 mt-8">
    <!-- Mejorar -->
    <div class="flex">
        <select id="por_pagina">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
        </select>
        <span>Por página</span>
    </div>

    <!-- Paginación a la derecha -->
    <nav class="flex items-center gap-1">
        <button id="btnAnterior" type="button"
            class="px-4 py-2 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed" disabled>
            Anterior
        </button>
        <div id="numerosPagina" class="flex items-center gap-1">
            <!-- <button class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">
                1
            </button>
            <button class="px-4 py-2 rounded-lg border">
                2
            </button>
            <button class="px-4 py-2 rounded-lg border">
                3
            </button> -->
        </div>
        <button id="btnSiguiente" type="button"
            class="px-4 py-2 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed" disabled>
            Siguiente
        </button>
    </nav>

</div>

<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4">
    <div class="relative w-full max-w-3xl rounded-xl bg-white p-6 shadow-xl">
        <button onclick="cerrarModal()" class="absolute right-4 top-4 text-2xl text-gray-500 hover:text-red-500">
            &times;
        </button>
        <h2 class="mb-6 text-2xl font-bold text-gray-800">
            Detalle del producto
        </h2>
        <div class="grid gap-6 md:grid-cols-2">

            <div class="relative">
                <img id="imgProducto" src="img/producto.jpg" class="w-full h-64 object-contain bg-gray-100 rounded-lg">
                <button onclick="cambiarImagen(-1)"
                    class="absolute left-2 top-1/2 -translate-y-1/2 bg-white p-2 rounded-full shadow">
                    ❮
                </button>
                <button onclick="cambiarImagen(1)"
                    class="absolute right-2 top-1/2 -translate-y-1/2 bg-white p-2 rounded-full shadow">
                    ❯
                </button>
            </div>
            <div class="space-y-4">
                <h3 id="txtTitulo" class="text-xl font-bold text-gray-800">
                </h3>
                <p id="txtDescripcion" class="text-sm leading-relaxed text-gray-600"></p>
                <p class="text-2xl font-bold text-blue-600">
                    S/ <span id="txtPrecio"></span></p>
            </div>
        </div>
        <div class="flex justify-end gap-2">
            <button onclick="cerrarModal()" class="px-4 py-2 rounded bg-gray-500 text-white">
                Cerrar
            </button>
        </div>
    </div>
</div>

<div id="modalEditar" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">

    <div class="bg-white w-full max-w-lg rounded-xl shadow-lg">

        <div class="flex justify-between items-center p-5 border-b">
            <h2 class="text-xl font-semibold text-gray-800">
                Editar producto
            </h2>

            <button onclick="cerrarModales()" class="text-gray-500 hover:text-gray-800">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <form id="formEditar" class="p-5 space-y-4">

            <input type="hidden" id="edit_id" name="id">

            <div>
                <label class="block text-sm font-medium mb-1">
                    Nombre
                </label>
                <input type="text" id="edit_nombre" name="nombre"
                    class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">
                    Precio
                </label>
                <input type="number" id="edit_precio" name="precio" step="0.01" min="0"
                    class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">
                    Stock
                </label>
                <input type="number" id="edit_stock" name="stock" min="0"
                    class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">
                    Estado
                </label>
                <select id="edit_state" name="state" class="w-full border rounded-lg p-2.5">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>

            <div class="flex justify-end gap-3 pt-3">
                <button type="button" onclick="cerrarModales()" class="px-4 py-2 border rounded-lg hover:bg-gray-100">
                    Cancelar
                </button>

                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    Guardar cambios
                </button>
            </div>

        </form>
    </div>
</div>
